<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Mural de HH — Fertgrow</title>
<style>
  :root{
    --bg:#0a1410; --surface:#101d16; --surface2:#16261d; --border:#213328;
    --text:#e9f2ea; --muted:#8aa08d; --brand:#0B6B33; --brand-light:#AFD676;
    --emerald:#34d399; --amber:#fbbf24; --rose:#fb7185; --cyan:#22d3ee;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,'Segoe UI',Inter,sans-serif;font-size:14px;}
  .row-flex{display:flex;align-items:center;gap:8px;}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;}
  .empty{text-align:center;color:var(--muted);padding:50px 20px;border:1px dashed var(--border);border-radius:14px;}
  .empty h3{color:var(--text);font-size:15px;margin-bottom:6px;}
  .badge{padding:3px 9px;border-radius:6px;font-size:11.5px;font-weight:600;white-space:nowrap;display:inline-block;}
  .btn{background:var(--brand);color:#fff;border:none;padding:9px 16px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;}
  .btn:hover{background:var(--brand-light);}
  .btn.ghost{background:transparent;border:1px solid var(--border);color:var(--muted);}
  .btn.ghost:hover{color:var(--text);border-color:#2c4534;}
  .btn.small{padding:5px 10px;font-size:12px;}
  .btn.icon-only{padding:6px;background:transparent;color:var(--muted);}
  .btn.icon-only:hover{color:var(--brand-light);background:#17271c;}
  select{background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:6px 10px;border-radius:8px;font-size:13px;}
  .modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:2000;}
  .modal{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:18px;width:90%;}
  .modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
  .modal-head h3{margin:0;font-size:16px;}
</style>
</head>
<body>
<div id="root"></div>
<div id="modalRoot"></div>
<script>
  // ---------------------------------------------------------------------------------------------
  // Mural de HH — página sozinha, pensada pra abrir direto na TV (sem precisar do computador ligado
  // ou do painel admin aberto). Mesma chave pública (anon, "sb_publishable_...") já usada no Portal
  // do Colaborador e no Portal do Gestor -- não é segredo, só destranca a chamada da Edge Function.
  // Todo o desenho (Gantt, slides, legenda, ajuste de tela) foi copiado do painel admin-desktop
  // (sistema_gestao_projetos (16).html, função openMuralPresentationModal e redondezas) -- se mexer
  // num lugar, lembrar de mexer no outro também (ou, melhor ainda, puxar os dois de um arquivo JS
  // compartilhado no futuro).
  // ---------------------------------------------------------------------------------------------
  const SUPABASE_URL = "https://eusvotyusfwxolczqzlc.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_2Uee6RYvUtvR5m4Vy6yyDQ_fgEeGEsX";

  const $ = (sel, root=document) => root.querySelector(sel);
  const $$ = (sel, root=document) => Array.from(root.querySelectorAll(sel));
  const esc = (s) => String(s==null?"":s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  // Smart TV costuma vir com o fuso horário mal configurado de fábrica (ou direto em UTC) -- confiar no
  // relógio/fuso do próprio aparelho (new Date().getHours() etc.) mostrava hora errada. Em vez disso,
  // pega só o instante (que normalmente está certo, sincronizado pela internet) e desloca manualmente
  // pro horário de Brasília (UTC-3, sem horário de verão desde 2019) -- mesma conta que a Edge Function
  // já faz do lado do servidor. Funciona não importa o fuso que a TV estiver configurada.
  function agoraBrasilia(){ return new Date(Date.now() - 3*3600000); }
  function horaBrasiliaStr(d){ d = d || agoraBrasilia(); return `${String(d.getUTCHours()).padStart(2,"0")}:${String(d.getUTCMinutes()).padStart(2,"0")}:${String(d.getUTCSeconds()).padStart(2,"0")}`; }
  const todayISO = () => { const d = agoraBrasilia(); return `${d.getUTCFullYear()}-${String(d.getUTCMonth()+1).padStart(2,"0")}-${String(d.getUTCDate()).padStart(2,"0")}`; };
  function addDays(iso,n){ const d=new Date(iso+"T00:00:00Z"); d.setUTCDate(d.getUTCDate()+n); return toISO(d); }
  function toISO(d){ if(!d) return ""; return d.toISOString().slice(0,10); }
  function brDate(iso){ if(!iso) return "—"; const [y,m,d]=iso.split("-"); return `${d}/${m}/${y}`; }

  async function fetchMuralDia(date){
    const resp = await fetch(`${SUPABASE_URL}/functions/v1/melvin-mural-dia`, {
      method: "POST",
      headers: { "Content-Type":"application/json", "Authorization": `Bearer ${SUPABASE_ANON_KEY}`, "apikey": SUPABASE_ANON_KEY },
      body: JSON.stringify({ data: date }),
    });
    const result = await resp.json();
    if(!resp.ok || result.error) throw new Error(result.error || `HTTP ${resp.status}`);
    return result;
  }

  let muralBlockDetails = new Map();
  const MURAL_HORA_INICIO = 5, MURAL_HORA_FIM = 24;
  function muralTimeToPct(hms){
    if(!hms) return null;
    const [hh,mm] = hms.split(":").map(Number);
    const totalMin = (MURAL_HORA_FIM-MURAL_HORA_INICIO)*60;
    const min = hh*60+(mm||0) - MURAL_HORA_INICIO*60;
    return Math.max(0, Math.min(100, (min/totalMin)*100));
  }
  function muralRegisterBlock(detail){
    const key = "b"+muralBlockDetails.size;
    muralBlockDetails.set(key, detail);
    return key;
  }
  function openMuralOSModal(key){
    const d = muralBlockDetails.get(key);
    if(!d) return;
    $("#modalRoot").innerHTML = `
      <div class="modal-backdrop" id="backdrop">
        <div class="modal" style="max-width:420px">
          <div class="modal-head"><h3>OS ${d.codOrdem}</h3><button class="btn icon-only" id="closeModal">✕</button></div>
          <p style="margin:0 0 10px;font-size:13.5px">${esc(d.descricao)||"—"}</p>
          ${d.tag ? `<p style="margin:0 0 10px;font-size:12px;color:var(--muted)">${esc(d.tag)}</p>` : ""}
          <div style="display:flex;flex-direction:column;gap:6px;font-size:12.5px">
            <div><b>Funcionário:</b> ${esc(d.nome)}</div>
            <div><b>Situação:</b> ${esc(d.situacao)}</div>
            ${d.horaInicio ? `<div><b>Horário:</b> ${d.horaInicio.slice(0,5)}–${d.horaFim?d.horaFim.slice(0,5):"?"}</div>` : ""}
          </div>
        </div>
      </div>`;
    const close = () => { $("#modalRoot").innerHTML = ""; };
    $("#closeModal").addEventListener("click", close);
    $("#backdrop").addEventListener("click", e => { if(e.target.id==="backdrop") close(); });
  }
  function muralFuncionarioRowHTML(f, big, agoraHMS){
    const nameW = big ? 240 : 170;
    const rowH = big ? 30 : 22;
    const nameFont = big ? "16px" : "12px";
    const barFont = big ? "11px" : "9px";
    const turnoIniPct = f.turnoInicio ? muralTimeToPct(f.turnoInicio) : null;
    let turnoFimPct = f.turnoFim ? muralTimeToPct(f.turnoFim) : null;
    if(turnoIniPct!=null && turnoFimPct!=null && turnoFimPct <= turnoIniPct) turnoFimPct = 100;

    const blocosOrdenados = [...f.blocos].sort((a,b)=>(a.horaInicio||"").localeCompare(b.horaInicio||""));
    const segments = [];
    const situacaoLabel = { programada:"Programada", corretiva:"Corretiva (não estava programada)", em_execucao:"Em execução agora (fim estimado -- ainda não foi finalizada de verdade)" };
    blocosOrdenados.forEach(b => {
      if(!b.horaInicio) return;
      const ini = muralTimeToPct(b.horaInicio);
      const fim = b.horaFim ? muralTimeToPct(b.horaFim) : Math.min(100, ini+2);
      const kind = b.status;
      const key = muralRegisterBlock({ codOrdem:b.codOrdem, descricao:b.descricao, tag:b.tag, nome:f.nome, horaInicio:b.horaInicio, horaFim:b.horaFim, situacao: situacaoLabel[b.status] || b.status });
      const horaTxt = b.status==="em_execucao" ? `${b.horaInicio.slice(0,5)}–${b.horaFim.slice(0,5)} estimado, em execução` : `${b.horaInicio.slice(0,5)}–${b.horaFim?b.horaFim.slice(0,5):"?"}`;
      segments.push({ kind, left: ini, width: Math.max(0.6, fim-ini), label: `OS ${b.codOrdem}${b.status==="em_execucao"?" ⏳":""}`, title: `OS ${b.codOrdem} — ${b.descricao} (${horaTxt})`, key });
    });
    if(turnoIniPct!=null && turnoFimPct!=null){
      let cursor = turnoIniPct;
      segments.sort((a,b)=>a.left-b.left).forEach(seg => {
        if(seg.left > cursor+0.3) segments.push({ kind:"lacuna", left:cursor, width: seg.left-cursor, title:"Lacuna — sem OS apontada" });
        cursor = Math.max(cursor, seg.left+seg.width);
      });
      if(turnoFimPct > cursor+0.3) segments.push({ kind:"lacuna", left:cursor, width: turnoFimPct-cursor, title:"Lacuna — sem OS apontada" });
    }
    const naoComecouAinda = agoraHMS!=null && f.turnoInicio && agoraHMS < f.turnoInicio;
    const ausente = !!f.ausente;
    const ocioso = turnoIniPct!=null && blocosOrdenados.length===0 && !f.previstas.length && !naoComecouAinda && !ausente;
    const segmentsHTML = segments.map(s => {
      const bg = s.kind==="programada" ? "var(--brand-light)"
        : s.kind==="corretiva" ? "var(--cyan)"
        : s.kind==="em_execucao" ? "var(--amber)"
        : "repeating-linear-gradient(45deg,rgba(241,109,109,.14),rgba(241,109,109,.14) 5px,rgba(241,109,109,.04) 5px,rgba(241,109,109,.04) 10px)";
      const color = s.kind==="lacuna" ? "transparent" : "#06130c";
      const clickAttr = s.key ? `data-muralblock="${s.key}" style="cursor:pointer;position:absolute;left:${s.left}%;width:${s.width}%;top:0;bottom:0;border-radius:4px;background:${bg};display:flex;align-items:center;justify-content:center;font-size:${barFont};font-weight:800;color:${color};overflow:hidden;white-space:nowrap"` : `style="position:absolute;left:${s.left}%;width:${s.width}%;top:0;bottom:0;border-radius:4px;background:${bg};display:flex;align-items:center;justify-content:center;font-size:${barFont};font-weight:800;color:${color};overflow:hidden;white-space:nowrap"`;
      return `<div title="${esc(s.title)}" ${clickAttr}>${s.kind!=="lacuna"?esc(s.label):""}</div>`;
    }).join("");
    const previstasHTML = f.previstas.length ? `
      <div style="display:flex;flex-wrap:wrap;gap:4px;margin:3px 0 2px ${nameW+10}px">
        ${f.previstas.map(p => {
          const key = muralRegisterBlock({ codOrdem:p.codOrdem, descricao:p.descricao, tag:p.tag, nome:f.nome, horaInicio:null, horaFim:null, situacao:"Prevista — programada pra hoje, ainda sem apontamento" });
          return `<span data-muralblock="${key}" style="cursor:pointer;font-size:${big?'12px':'9.5px'};padding:2px 7px;border-radius:20px;background:rgba(34,211,238,.14);color:var(--cyan);border:1px solid rgba(34,211,238,.35)">📋 OS ${p.codOrdem}</span>`;
        }).join("")}
      </div>` : "";
    return `
      <div style="padding:${big?'6px':'4px'} 0">
        <div class="row-flex" style="gap:10px;align-items:center">
          <div style="width:${nameW}px;flex:0 0 auto;font-size:${nameFont};font-weight:600;display:flex;align-items:center;gap:6px">
            ${esc(f.nome)}
            ${ausente ? `<span class="badge" style="font-size:${big?'10px':'8.5px'};background:rgba(138,148,172,.18);color:var(--muted)">AUSENTE</span>` : ""}
            ${!ausente && ocioso ? `<span class="badge" style="font-size:${big?'10px':'8.5px'};background:rgba(244,63,94,.18);color:var(--rose)">OCIOSO</span>` : ""}
            ${!ausente && naoComecouAinda ? `<span class="badge" style="font-size:${big?'10px':'8.5px'};background:rgba(255,255,255,.06);color:var(--muted)">turno às ${esc((f.turnoInicio||"").slice(0,5))}</span>` : ""}
          </div>
          <div style="flex:1;position:relative;height:${rowH}px;background:var(--surface2);border-radius:5px">${segmentsHTML}</div>
        </div>
        ${previstasHTML}
      </div>
    `;
  }
  function muralOficinasHTML(data, big, groupsOverride){
    muralBlockDetails = new Map();
    const groups = groupsOverride || data.oficinas;
    const hourFont = big ? "14px" : "9.5px";
    const nameW = big ? 240 : 170;
    const hoursHeader = [];
    for(let h=MURAL_HORA_INICIO; h<MURAL_HORA_FIM; h++) hoursHeader.push(`<div style="flex:1;font-size:${hourFont};color:var(--muted);text-align:left">${String(h).padStart(2,"0")}h</div>`);
    const agora = agoraBrasilia();
    const souHoje = data.data === todayISO();
    const agoraHMS = souHoje ? `${String(agora.getUTCHours()).padStart(2,"0")}:${String(agora.getUTCMinutes()).padStart(2,"0")}:00` : null;
    const agoraLine = souHoje ? (() => {
      const pct = muralTimeToPct(`${String(agora.getUTCHours()).padStart(2,"0")}:${String(agora.getUTCMinutes()).padStart(2,"0")}:00`);
      if(pct==null || pct<0 || pct>100) return "";
      const leftCalc = `calc(${nameW}px + (100% - ${nameW}px) * ${(pct/100).toFixed(4)})`;
      return `<div style="position:absolute;left:${leftCalc};top:0;bottom:0;width:0;border-left:2px dashed var(--brand-light);z-index:2;pointer-events:none">
        <div style="position:absolute;top:-2px;left:4px;font-size:${big?'11px':'9px'};font-weight:800;color:var(--brand-light);white-space:nowrap">AGORA ${String(agora.getUTCHours()).padStart(2,"0")}:${String(agora.getUTCMinutes()).padStart(2,"0")}</div>
      </div>`;
    })() : "";
    return `
      <div style="position:relative">
        ${agoraLine}
        <div class="row-flex" style="gap:10px;margin-bottom:10px">
          <div style="width:${nameW}px;flex:0 0 auto"></div>
          <div style="flex:1;display:flex">${hoursHeader.join("")}</div>
        </div>
        ${groups.map(group => `
          <div style="font-size:${big?'15px':'11px'};font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--brand-light);padding:${big?'14px':'10px'} 0 4px;border-top:1px solid var(--border)">${esc(group.setor)}</div>
          ${group.funcionarios.map(f=>muralFuncionarioRowHTML(f,big,agoraHMS)).join("")}
          ${group.atrasadas && group.atrasadas.length ? `
          <div style="background:rgba(251,113,133,.08);border:1px solid rgba(251,113,133,.3);border-radius:8px;padding:8px 10px;margin:6px 0 2px ${nameW+10}px">
            <div style="font-size:${big?'13px':'10px'};font-weight:700;color:var(--rose);margin-bottom:4px">⚠ ${group.atrasadas.length} OS atrasada${group.atrasadas.length===1?'':'s'} desse setor (data agendada já passou)</div>
            <div style="display:flex;flex-wrap:wrap;gap:4px">
              ${group.atrasadas.map(a => `<span title="${esc(a.descricao)} — prevista pra ${brDate(a.scheduledDate)}" style="font-size:${big?'12px':'9.5px'};padding:3px 8px;border-radius:20px;background:rgba(251,113,133,.18);color:var(--rose);border:1px solid rgba(251,113,133,.35)">OS ${a.codOrdem}</span>`).join("")}
            </div>
          </div>` : ""}
        `).join("")}
      </div>
    `;
  }
  function muralLegendaHTML(){
    return `
      <div class="row-flex" style="gap:16px;font-size:11px;color:var(--muted);margin-top:12px;flex-wrap:wrap">
        <div class="row-flex" style="gap:5px"><div style="width:10px;height:10px;border-radius:3px;background:var(--brand-light)"></div>OS programada, concluída</div>
        <div class="row-flex" style="gap:5px"><div style="width:10px;height:10px;border-radius:3px;background:var(--cyan)"></div>OS corretiva, concluída (não estava programada)</div>
        <div class="row-flex" style="gap:5px"><div style="width:10px;height:10px;border-radius:3px;background:var(--amber)"></div>⏳ Em execução agora (até o fim estimado)</div>
        <div class="row-flex" style="gap:5px"><div style="width:10px;height:10px;border-radius:3px;background:repeating-linear-gradient(45deg,rgba(241,109,109,.14),rgba(241,109,109,.14) 4px,rgba(241,109,109,.04) 4px,rgba(241,109,109,.04) 8px)"></div>Lacuna sem OS</div>
        <div class="row-flex" style="gap:5px"><span style="font-size:9.5px;padding:2px 7px;border-radius:20px;background:rgba(34,211,238,.14);color:var(--cyan);border:1px solid rgba(34,211,238,.35)">📋 OS</span>Prevista pra hoje, ainda sem apontamento</div>
        <div class="row-flex" style="gap:5px"><span style="font-size:9.5px;padding:2px 7px;border-radius:20px;background:rgba(251,113,133,.18);color:var(--rose);border:1px solid rgba(251,113,133,.35)">OS</span>Atrasada (de dia(s) anterior(es))</div>
        <div class="row-flex" style="gap:5px"><span class="badge" style="font-size:9.5px;background:rgba(244,63,94,.18);color:var(--rose)">OCIOSO</span>Escalado, turno já começou, sem nenhuma OS</div>
        <div class="row-flex" style="gap:5px"><span class="badge" style="font-size:9.5px;background:rgba(138,148,172,.18);color:var(--muted)">AUSENTE</span>Falta lançada na frequência do dia</div>
      </div>
    `;
  }
  function muralOSLegendHTML(group){
    const map = new Map();
    group.funcionarios.forEach(f => {
      f.blocos.forEach(b => { if(!map.has(b.codOrdem)) map.set(b.codOrdem, b.descricao||""); });
      f.previstas.forEach(p => { if(!map.has(p.codOrdem)) map.set(p.codOrdem, p.descricao||""); });
    });
    (group.atrasadas||[]).forEach(a => { if(!map.has(a.codOrdem)) map.set(a.codOrdem, a.descricao||""); });
    if(!map.size) return "";
    const items = [...map.entries()].sort((a,b)=>a[0]-b[0]);
    return `
      <div style="background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:14px 18px;margin-top:14px">
        <div style="font-size:12.5px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin-bottom:10px">Legenda das OS desse setor</div>
        <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:7px 20px">
          ${items.map(([cod,desc]) => `<div style="font-size:14px;line-height:1.3"><b style="color:var(--brand-light)">OS ${cod}</b> — ${desc ? esc(desc) : `<span style="color:var(--muted)">sem descrição</span>`}</div>`).join("")}
        </div>
      </div>
    `;
  }

  // ---------------------------------------------------------------------------------------------
  // Controlador da tela inteira -- diferente do modal do painel admin, essa página NÃO tem "Fechar"
  // (é a única coisa que existe aqui) e acompanha o dia de hoje sozinha: se passar da meia-noite com
  // a TV ligada, troca pro novo dia automaticamente sem precisar de ninguém mexer em nada. Só para de
  // seguir "hoje" se alguém usar as setinhas pra olhar outro dia -- aí fica lá até clicar "Hoje" nenhum.
  // ---------------------------------------------------------------------------------------------
  // O próprio Melvin confirmou: pode consultar no máximo a cada 30min -- nunca oferece nada mais
  // rápido que isso, pra não arriscar tomar bloqueio de novo (já aconteceu uma vez por volume alto).
  const RATE_OPTIONS = [1800, 3600, 7200];
  const SLIDE_OPTIONS = [8, 12, 20, 30];
  let date = todayISO();
  let followingToday = true;
  let dayData = null;
  let REFRESH_SECONDS = 1800, secondsLeft = REFRESH_SECONDS;
  let slideMode = true, SLIDE_SECONDS = 12, slideSecondsLeft = SLIDE_SECONDS, slideIdx = 0;
  let ticker = null;

  function rateLabel(s){
    if(s<60) return s+"s";
    if(s<3600) return (s/60)+"min";
    return (s/3600)+"h";
  }
  function rateOptionsHTML(){
    return RATE_OPTIONS.map(s => `<option value="${s}" ${s===REFRESH_SECONDS?"selected":""}>${rateLabel(s)}</option>`).join("");
  }
  function horaBrasiliaHM(d){ return horaBrasiliaStr(d).slice(0,5); }
  function slideRateOptionsHTML(){
    return SLIDE_OPTIONS.map(s => `<option value="${s}" ${s===SLIDE_SECONDS?"selected":""}>${s}s</option>`).join("");
  }

  function paint(){
    const dateLabel = new Date(date+"T00:00:00").toLocaleDateString("pt-BR",{weekday:"long", day:"2-digit", month:"long", year:"numeric"});
    const oficinas = (dayData && dayData.oficinas) || [];
    if(slideIdx >= oficinas.length) slideIdx = 0;
    const showingSlide = slideMode && oficinas.length>0;
    const slideGroups = showingSlide ? [oficinas[slideIdx]] : null;
    const dotsHTML = showingSlide && oficinas.length>1 ? `
      <div class="row-flex" style="justify-content:center;gap:6px;margin-bottom:12px">
        ${oficinas.map((o,i)=>`<div title="${esc(o.setor)}" style="width:${i===slideIdx?'22px':'8px'};height:8px;border-radius:4px;background:${i===slideIdx?'var(--brand-light)':'var(--border)'}"></div>`).join("")}
      </div>` : "";
    $("#root").innerHTML = `
      <div id="muralPresentationOuter" style="position:fixed;inset:0;background:var(--bg);overflow:auto;padding:28px 36px">
        <div id="muralPresentationInner" style="max-width:1700px;margin:0 auto">
          <div class="row-flex" style="justify-content:space-between;align-items:flex-start;margin-bottom:20px;gap:12px">
            <div>
              <div style="font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:700">Mural de HH — Fertgrow</div>
              <div class="row-flex" style="gap:8px;margin-top:4px">
                <button class="btn ghost icon-only small" id="prevDayBtn" type="button" title="Dia anterior">‹</button>
                <div style="font-size:26px;font-weight:800;text-transform:capitalize">${esc(dateLabel)}</div>
                <button class="btn ghost icon-only small" id="nextDayBtn" type="button" title="Dia seguinte">›</button>
                ${!followingToday ? `<button class="btn small" id="todayBtn" type="button" style="width:auto">🏠 Hoje</button>` : ""}
              </div>
              ${showingSlide ? `<div style="font-size:14px;color:var(--brand-light);font-weight:700;margin-top:4px">Setor ${slideIdx+1} de ${oficinas.length} — ${esc(oficinas[slideIdx].setor)}</div>` : ""}
            </div>
            <div class="row-flex" style="gap:16px;align-items:center;flex-wrap:wrap;justify-content:flex-end">
              <div id="muralLiveClock" style="font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--text)">${esc(horaBrasiliaStr())}</div>
              <label class="row-flex" style="gap:6px;align-items:center;font-size:11.5px;color:var(--muted);cursor:pointer">
                <input type="checkbox" id="muralSlideToggle" ${slideMode?"checked":""} /> Slides por setor
              </label>
              ${slideMode ? `
              <div class="row-flex" style="gap:6px;align-items:center">
                <button class="btn ghost icon-only small" id="muralSlidePrevBtn" type="button" title="Setor anterior">‹</button>
                <select id="muralSlideRate" title="Troca de setor a cada">${slideRateOptionsHTML()}</select>
                <button class="btn ghost icon-only small" id="muralSlideNextBtn" type="button" title="Próximo setor">›</button>
              </div>` : ""}
              <div class="row-flex" style="gap:8px;align-items:center">
                <label for="muralRefreshRate" style="font-size:11.5px;color:var(--muted)">Atualiza a cada</label>
                <select id="muralRefreshRate">${rateOptionsHTML()}</select>
              </div>
              <div style="font-size:11.5px;color:var(--muted);text-align:right;line-height:1.5">
                <div>Dados de: <b style="color:var(--text)">${lastRefreshAt ? esc(horaBrasiliaHM(lastRefreshAt)) : "—"}</b></div>
                <div>Próxima busca: <b style="color:var(--brand-light)">${esc(horaBrasiliaHM(new Date(agoraBrasilia().getTime() + Math.max(0,secondsLeft)*1000)))}</b></div>
              </div>
            </div>
          </div>
          ${dotsHTML}
          ${!dayData || !oficinas.length
            ? `<div class="empty"><h3>Nenhuma OS com apontamento nesse dia</h3></div>`
            : `<div class="card">${muralOficinasHTML(dayData,true,slideGroups)}</div>${showingSlide ? muralOSLegendHTML(oficinas[slideIdx]) : ""}${muralLegendaHTML()}`}
        </div>
      </div>
    `;
    $("#prevDayBtn").addEventListener("click", () => changeDay(-1));
    $("#nextDayBtn").addEventListener("click", () => changeDay(1));
    const todayBtn = $("#todayBtn");
    if(todayBtn) todayBtn.addEventListener("click", () => { followingToday = true; date = todayISO(); refresh(); });
    $("#muralRefreshRate").addEventListener("change", e => {
      REFRESH_SECONDS = Number(e.target.value) || 1800;
      secondsLeft = REFRESH_SECONDS;
    });
    $("#muralSlideToggle").addEventListener("change", e => {
      slideMode = e.target.checked;
      slideIdx = 0;
      slideSecondsLeft = SLIDE_SECONDS;
      paint();
    });
    const slideRateSel = $("#muralSlideRate");
    if(slideRateSel) slideRateSel.addEventListener("change", e => {
      SLIDE_SECONDS = Number(e.target.value) || 12;
      slideSecondsLeft = SLIDE_SECONDS;
    });
    const slidePrevBtn = $("#muralSlidePrevBtn");
    if(slidePrevBtn) slidePrevBtn.addEventListener("click", () => {
      const n = ((dayData && dayData.oficinas)||[]).length;
      if(!n) return;
      slideIdx = (slideIdx - 1 + n) % n;
      slideSecondsLeft = SLIDE_SECONDS;
      paint();
    });
    const slideNextBtn = $("#muralSlideNextBtn");
    if(slideNextBtn) slideNextBtn.addEventListener("click", () => {
      const n = ((dayData && dayData.oficinas)||[]).length;
      if(!n) return;
      slideIdx = (slideIdx + 1) % n;
      slideSecondsLeft = SLIDE_SECONDS;
      paint();
    });
    $$("[data-muralblock]").forEach(el => el.addEventListener("click", () => openMuralOSModal(el.dataset.muralblock)));
    requestAnimationFrame(fitToScreen);
  }

  function fitToScreen(){
    const outer = document.getElementById("muralPresentationOuter");
    const inner = document.getElementById("muralPresentationInner");
    if(!outer || !inner) return;
    inner.style.transform = "";
    inner.style.width = "";
    inner.style.transformOrigin = "top center";
    const availableH = outer.clientHeight - 16;
    const contentH = inner.scrollHeight;
    if(contentH > availableH){
      const scale = Math.max(0.4, availableH / contentH);
      inner.style.transform = `scale(${scale})`;
      inner.style.width = `${(100/scale).toFixed(3)}%`;
    }
  }

  function changeDay(delta){
    followingToday = false;
    date = addDays(date, delta);
    refresh();
  }

  let lastRefreshAt = null;
  async function refresh(){
    try{ dayData = await fetchMuralDia(date); lastRefreshAt = agoraBrasilia(); }
    catch(err){ /* falha momentânea -- mantém o último dado bom na tela, tenta de novo no próximo ciclo */ }
    secondsLeft = REFRESH_SECONDS;
    secondsSinceRepaint = 0;
    paint();
  }

  // A linha pontilhada "AGORA" e os avisos de "ocioso"/"turno ainda não começou" dependem só da hora
  // atual, não de dado novo do Melvin -- pedido explícito do usuário pra continuarem se mexendo de
  // minuto a minuto, mesmo com a busca de dado de verdade só acontecendo a cada 30min+ (limite que o
  // Melvin pediu). Por isso repinta a tela de novo a cada minuto usando os MESMOS dados já buscados
  // (sem chamada nenhuma pro Melvin), só pra reposicionar a linha do tempo.
  let secondsSinceRepaint = 0;
  window.addEventListener("resize", fitToScreen);
  refresh();
  ticker = setInterval(() => {
    secondsLeft--;
    secondsSinceRepaint++;
    const clockEl = document.getElementById("muralLiveClock");
    if(clockEl) clockEl.textContent = horaBrasiliaStr();
    let needRepaint = false;
    if(secondsSinceRepaint>=60){ secondsSinceRepaint = 0; needRepaint = true; }
    if(slideMode && ((dayData && dayData.oficinas)||[]).length>1){
      slideSecondsLeft--;
      if(slideSecondsLeft<=0){
        slideIdx = (slideIdx+1) % dayData.oficinas.length;
        slideSecondsLeft = SLIDE_SECONDS;
        needRepaint = true;
      }
    }
    // Virou o dia de verdade (TV ligada passando da meia-noite) -- acompanha sozinho, sem precisar
    // de ninguém mexer, só se ninguém tiver navegado manualmente pra outro dia nesse meio tempo.
    if(followingToday && todayISO() !== date){ date = todayISO(); refresh(); return; }
    if(secondsLeft<=0){ refresh(); return; }
    if(needRepaint) paint();
  }, 1000);
</script>
</body>
</html>
